<style>

<canvas id="c"></canvas>
<div id="top" class="pn"><h1>Steve's Bot Office</h1><span id="clock"></span><span id="live" class="d" style="background:#959595" title="feed"></span><button id="dn">☾ Night</button><button id="gear" title="Settings">⚙</button>

<script type="module">
import * as THREE from 'three';import {RoundedBoxGeometry} from 'three/addons/geometries/RoundedBoxGeometry.js';
const T=decodeURIComponent(location.hash.slice(1));
const TEAMS=['Build','Vanguard','Markets','Family','Ops'];const COL={working:'#1E86FC',done:'#14C16F',idle:'#c8c8c8',waiting_user:'#F59312',error:'#E5484D'};
const S={roster:[],groups:{},chat:{},looks:{},routines:{},status:{},usage:null,log:[]};
const key=n=>(n||'').split('·')[0].trim();
const find=(o,n)=>{if(!o)return;const k=key(n);if(o[k]!==undefined)return o[k];if(o[n]!==undefined)return o[n];const kl=k.toLowerCase();for(const x in o){const xl=key(x).toLowerCase();if(xl===kl||kl.startsWith(xl+' ')||xl.startsWith(kl+' '))return o[x]}};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pt=t=>new Date(t*1e3).toLocaleTimeString('en-US',{timeZone:'America/Los_Angeles',hour:'numeric',minute:'2-digit'});
const ago=t=>{if(!t)return'';const s=Math.max(0,Date.now()/1e3-t);return(s<60?Math.floor(s)+'s':s<3600?Math.floor(s/60)+'m':s<86400?Math.floor(s/3600)+'h':Math.floor(s/86400)+'d')+' ago · '+pt(t)+' PT'};
const st=n=>(find(S.status,n)||{});const stat=n=>st(n).status||'idle';
const names=()=>{const r=S.roster.map(key);Object.keys(S.status).forEach(k=>{if(!r.some(x=>x.toLowerCase()===k.toLowerCase()))r.push(k)});return r};
const full=n=>S.roster.find(r=>key(r)===n)||n;const team=n=>{const g=find(S.groups,n);return TEAMS.includes(g)?g:(g||'Ops')};
const cfg=()=>{try{return JSON.parse(localStorage.getItem('hqcfg')||'{}')}catch{return{}}};
function toast(m,ok){const e=document.getElementById('toast');e.textContent=m;e.style.background=ok?'#14C16F':'#E5484D';e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',3000)}
async function sendTo(to,action,text,ref){const body=JSON.stringify({to:full(to),action,text,ref:ref||'',at:new Date().toISOString()});const c=cfg();
 try{let r;if(c.mode==='direct'&&c.url){r=await fetch(c.url,{method:'POST',headers:{'Authorization':'Bearer '+(c.key||''),'Content-Type':'application/json'},body})}
 else{r=await fetch('https://ntfy.sh/'+encodeURIComponent(T+'-in'),{method:'POST',body})}
 if(!r.ok)throw new Error('HTTP '+r.status);toast((action==='approve'?'Approved → ':'Sent → ')+key(to),true);return true}catch(e){toast('Failed: '+(e.message||e)+(c.mode==='direct'?' (CORS?)':''),false);return false}}
const msgBox=(n,ap)=>`<div class="mb"><textarea data-to="${esc(n)}" placeholder="Message ${esc(key(n))}…"></textarea><button class="blk" data-send="${esc(n)}">Send</button></div>${ap?`<div class="acts"><button class="ok" data-ap="${esc(n)}">Approve</button>${chatBtn(n,'')}</div>`:''}`;
const chatBtn=(n,c='blk')=>{const l=find(S.chat,n);return l?`<a class="btn ${c}" href="${esc(l)}">Open chat</a>`:''};

/* ---------- 3D ---------- */
const cv=document.getElementById('c');const R=new THREE.WebGLRenderer({canvas:cv,antialias:true});R.setPixelRatio(Math.min(2,devicePixelRatio));R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();scene.background=new THREE.Color('#F5F5F5');
const cam=new THREE.OrthographicCamera(-1,1,1,-1,0.1,200);const FH=16;const ISO=new THREE.Vector3(1,0.82,1).normalize().multiplyScalar(60);
const target=new THREE.Vector3(0,0,0),camT=new THREE.Vector3();let zoom=9;
const hemi=new THREE.HemisphereLight(0xffffff,0xd9d4cc,1.1);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffffff,1.6);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-12,right:12,top:12,bottom:-12,near:1,far:80});sun.shadow.bias=-0.0005;scene.add(sun,sun.target);
const M=c=>new THREE.MeshStandardMaterial({color:c,roughness:.75,metalness:.02});
function box(w,h,d,c,x,y,z,p){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),typeof c==='object'?c:M(c));m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;p.add(m);return m}
function cyl(rt,rb,h,c,x,y,z,p,seg=20){const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg),M(c));m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;p.add(m);return m}
function canvasTex(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=4;return t}
function plane(w,h,tex,x,y,z,p,ry=0,em=false){const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshStandardMaterial({map:tex,emissive:em?0xffffff:0,emissiveMap:em?tex:null,emissiveIntensity:em?.55:0,roughness:.9}));m.position.set(x,y,z);m.rotation.y=ry;p.add(m);return m}
const FW=14,FD=10,floors={},seats={};
function desk(x,z,p,col='#e9e2d6'){box(1.6,.08,.8,col,x,.75,z,p);[-.7,.7].forEach(dx=>box(.06,.75,.7,'#bbb',x+dx,.375,z,p));box(.7,.45,.05,'#222',x,1.05,z-.25,p);const s=box(.64,.38,.01,new THREE.MeshStandardMaterial({color:'#9fd3ff',emissive:'#5fb4ff',emissiveIntensity:.5}),x,1.05,z-.22,p);box(.08,.2,.08,'#333',x,.85,z-.25,p);return s}
function plant(x,z,p){cyl(.22,.18,.35,'#d8c7b0',x,.18,z,p);const l=new THREE.Mesh(new THREE.IcosahedronGeometry(.42,0),M('#5BBF6A'));l.position.set(x,.75,z);l.castShadow=true;p.add(l)}
function buildFloor(name,i){const g=new THREE.Group();g.position.y=i*FH;scene.add(g);
 const slab=box(FW,.4,FD,'#fbfaf7',0,-.2,0,g);slab.userData.floor=name;
 box(FW,3.6,.2,'#efece6',0,1.8,-FD/2,g).userData.floor=name;box(.2,3.6,FD,'#e8e4dd',-FW/2,1.8,0,g).userData.floor=name;
 plane(6,1.1,canvasTex(1024,190,(x,w,h)=>{x.fillStyle='#efece6';x.fillRect(0,0,w,h);x.fillStyle='#222';x.font='800 120px Inter,sans-serif';x.textBaseline='middle';x.fillText(name.toUpperCase(),20,h/2+6)}),-3.4,2.9,-FD/2+.11,g);
 const S=[];const add=(x,z,c)=>{desk(x,z-.9,g,c);S.push(new THREE.Vector3(x,0,z))};
 if(name==='Build'){[-4,-1,2].forEach(x=>add(x,1.6));box(4,.9,1,'#b88a5a',3.5,.45,-3.8,g);box(4,.06,1.1,'#8a6440',3.5,.93,-3.8,g);['#E5484D','#1E86FC','#F59312'].forEach((c,k)=>box(.4,.3,.4,c,2+k*1.2,1.1,-3.8,g));plant(-6,-4,g)}
 if(name==='Vanguard'){for(let r=0;r<2;r++)for(let k=0;k<3;k++)if(S.length<4)add(-4+k*3,0.2+r*2.8,'#dfe7f0');plane(4,2,canvasTex(512,256,(x,w,h)=>{x.fillStyle='#1b2a3a';x.fillRect(0,0,w,h);x.fillStyle='#14C16F';x.font='700 34px Inter';x.fillText('JOBS TODAY',24,50);for(let k=0;k<5;k++){x.fillStyle=['#14C16F','#F59312','#1E86FC','#E5484D','#fff'][k];x.fillRect(24,80+k*32,60+Math.random()*380,18)}}),3.5,2,-FD/2+.11,g,0,true)}
 if(name==='Markets'){add(0,1.5);plane(6,2.4,canvasTex(768,300,(x,w,h)=>{x.fillStyle='#0f1520';x.fillRect(0,0,w,h);x.strokeStyle='#223';for(let k=0;k<8;k++){x.beginPath();x.moveTo(0,k*40);x.lineTo(w,k*40);x.stroke()}x.strokeStyle='#14C16F';x.lineWidth=6;x.beginPath();let y=220;for(let k=0;k<=24;k++){y=Math.max(30,Math.min(270,y+(Math.random()-.42)*45));k?x.lineTo(k*32,y):x.moveTo(0,y)}x.stroke()}),1.5,1.9,-FD/2+.11,g,0,true);plant(5.5,3.5,g)}
 if(name==='Family'){[[-3.5,1],[1.5,1.5],[4.5,-1.5]].forEach(([x,z])=>{cyl(.9,.9,.08,'#f1d9b5',x,.72,z-1,g,28);cyl(.1,.1,.7,'#bbb',x,.35,z-1,g);S.push(new THREE.Vector3(x,0,z))});plant(-6,-4,g);plant(6,-4,g);plant(-1,-3.5,g);box(3,.5,1,'#F93498',-3,.25,-4.1,g)}
 if(name==='Ops'){add(-3,1.6);add(.5,1.6);for(let k=0;k<4;k++){const r=box(.9,2.6,.9,'#2a2e38',2.6+k*1.05,1.3,-3.9,g);for(let j=0;j<6;j++)box(.7,.04,.02,new THREE.MeshStandardMaterial({color:'#14C16F',emissive:j%2?'#14C16F':'#1E86FC',emissiveIntensity:1}),2.6+k*1.05,.4+j*.38,-3.44,g)}plane(.01+3.6,2,canvasTex(400,220,(x,w,h)=>{x.fillStyle='#0b1220';x.fillRect(0,0,w,h);for(let a=0;a<14;a++)for(let b=0;b<8;b++){x.fillStyle=`hsla(${170+Math.random()*60},80%,${30+Math.random()*40}%,1)`;x.fillRect(8+a*28,8+b*26,22,20)}}),-FW/2+.11,1.9,0,g,Math.PI/2,true)}
 floors[name]={g,i};seats[name]=S}
TEAMS.forEach(buildFloor);

function starShape(n,ro,ri){const s=new THREE.Shape();for(let k=0;k<n*2;k++){const r=k%2?ri:ro,a=k*Math.PI/n+Math.PI/2;k?s.lineTo(r*Math.cos(a),r*Math.sin(a)):s.moveTo(r*Math.cos(a),r*Math.sin(a))}return s}
function blob(r,seed){const g=new THREE.IcosahedronGeometry(r,3);const p=g.attributes.position,v=new THREE.Vector3();for(let k=0;k<p.count;k++){v.fromBufferAttribute(p,k);const n=1+.12*Math.sin(v.x*5+seed)*Math.cos(v.y*4+seed*2)+.06*Math.sin(v.z*7);v.multiplyScalar(n);p.setXYZ(k,v.x,v.y,v.z)}g.computeVertexNormals();return g}
function botMesh(look){const c=look.color||'#959595',m=new THREE.MeshStandardMaterial({color:c,roughness:.45}),g=new THREE.Group();let geo,eyeZ=.36,eyeY=.05;
 switch(look.shape){case'hexagon':geo=new THREE.CylinderGeometry(.42,.42,.62,6);eyeZ=.37;break;
 case'triangle':geo=new THREE.ConeGeometry(.5,.85,3);eyeZ=.26;eyeY=-.12;break;
 case'pill':geo=new THREE.CapsuleGeometry(.28,.4,8,16);eyeZ=.28;break;
 case'bubble':geo=blob(.4,1.7);eyeZ=.42;break;
 case'rounded_square':geo=new RoundedBoxGeometry(.7,.7,.7,4,.16);eyeZ=.36;break;
 case'clover':{const cg=new THREE.Group();[[0,.17],[.17,0],[-.17,0],[0,-.17]].forEach(([x,y])=>{const s=new THREE.Mesh(new THREE.SphereGeometry(.25,20,16),m);s.position.set(x,y,0);s.castShadow=true;cg.add(s)});g.add(cg);eyeZ=.26;break}
 case'star4':geo=new THREE.ExtrudeGeometry(starShape(4,.5,.2),{depth:.3,bevelEnabled:true,bevelSize:.06,bevelThickness:.06,bevelSegments:3});geo.translate(0,0,-.15);eyeZ=.23;break;
 case'drop':{const pts=[];for(let k=0;k<=20;k++){const t=k/20,a=t*Math.PI;pts.push(new THREE.Vector2(.36*Math.sin(a)*(1-t*.55)**1.2,-.36*Math.cos(a)*(t<.5?1:1+(t-.5)*1.6)))}geo=new THREE.LatheGeometry(pts,28);eyeZ=.33;eyeY=-.04;break}
 default:geo=new THREE.SphereGeometry(.4,28,20);eyeZ=.39}
 if(geo){const b=new THREE.Mesh(geo,m);b.castShadow=true;g.add(b)}
 const em=new THREE.MeshBasicMaterial({color:'#111'});[-.11,.11].forEach(x=>{const e=new THREE.Mesh(new THREE.SphereGeometry(.05,12,8),em);e.position.set(x,eyeY,eyeZ);e.scale.z=.6;g.add(e)});
 if(look.tilt)g.rotation.z=.22;g.traverse(o=>o.userData.isBot=true);return g}
const bots={};
function layoutBots(){const by={};names().forEach(n=>(by[team(n)]??=[]).push(n));
 for(const n in bots)if(!names().includes(n)){scene.remove(bots[n].root);delete bots[n]}
 Object.entries(by).forEach(([t,ns])=>{const f=floors[t]||floors.Ops;const ss=seats[t]||seats.Ops;ns.forEach((n,k)=>{const look=find(S.looks,n)||{};const sig=JSON.stringify(look);let b=bots[n];
  if(!b||b.sig!==sig){if(b)b.root.parent.remove(b.root);const root=new THREE.Group(),body=botMesh(look);root.add(body);body.traverse(o=>o.userData.bot=n);b=bots[n]={root,body,sig,ph:Math.random()*6};}
  const s=ss[k%ss.length].clone();if(k>=ss.length){s.x+=1.0*Math.floor(k/ss.length);s.z+=1.2}b.root.position.copy(s);b.root.position.y=1.0;b.floor=t;if(b.root.parent!==f.g)f.g.add(b.root)})})}
let cur='Build';
function resize(){const w=innerWidth,h=innerHeight,a=w/h;zoom=a<1?8.2/a:Math.max(7.2,9.5/a);cam.left=-zoom*a;cam.right=zoom*a;cam.top=zoom;cam.bottom=-zoom;cam.updateProjectionMatrix();R.setSize(w,h,false)}
addEventListener('resize',resize);resize();
function goFloor(n){cur=n;renderUI()}
const ray=new THREE.Raycaster(),mv=new THREE.Vector2();let down=null;
cv.addEventListener('pointerdown',e=>down=[e.clientX,e.clientY]);
cv.addEventListener('pointerup',e=>{if(!down||Math.hypot(e.clientX-down[0],e.clientY-down[1])>6)return;mv.set(e.clientX/innerWidth*2-1,-e.clientY/innerHeight*2+1);ray.setFromCamera(mv,cam);const h=ray.intersectObjects(scene.children,true);for(const x of h){if(x.object.userData.bot){sel=x.object.userData.bot;cur=bots[sel].floor;renderUI();openTab('right');return}if(x.object.userData.floor){goFloor(x.object.userData.floor);return}}});
cv.addEventListener('wheel',e=>{const i=TEAMS.indexOf(cur)+(e.deltaY>0?-1:1);if(TEAMS[i]){goFloor(TEAMS[i])}},{passive:true});
const bubs={};const tmp=new THREE.Vector3();const clk=new THREE.Clock();
function loop(){const dt=Math.min(.05,clk.getDelta()),t=clk.elapsedTime;
 const fy=(floors[cur]?.i||0)*FH+.6;camT.set(0,fy,0);target.lerp(camT,1-Math.pow(.02,dt));cam.position.copy(target).add(ISO);cam.lookAt(target);
 sun.position.copy(target).add(new THREE.Vector3(8,16,10));sun.target.position.copy(target);
 for(const n in bots){const b=bots[n],s=stat(n);b.body.position.y=Math.sin(t*2+b.ph)*.07;const face=s==='working'?Math.PI:Math.PI/4+Math.sin(t*.7+b.ph)*.25;b.root.rotation.y+=(face-b.root.rotation.y)*Math.min(1,dt*3);
  const step=st(n).step;let el=bubs[n];const show=b.floor===cur&&step;
  if(show){if(!el){el=bubs[n]=document.createElement('div');el.className='bub';document.body.appendChild(el)}const txt=(s==='waiting_user'?'⏳ ':s==='error'?'⚠ ':'')+step;if(el.textContent!==txt)el.textContent=txt;b.root.getWorldPosition(tmp);tmp.y+=.85;tmp.project(cam);el.style.left=(tmp.x+1)/2*innerWidth+'px';el.style.top=(1-tmp.y)/2*innerHeight+'px';el.style.display=''}else if(el)el.style.display='none'}
 R.render(scene,cam);requestAnimationFrame(loop)}

/* ---------- UI ---------- */
let sel=null,night=false;const $=i=>document.getElementById(i);
$('dn').onclick=()=>{night=!night;document.body.classList.toggle('night',night);$('dn').textContent=night?'☀ Day':'☾ Night';scene.background.set(night?'#14161c':'#F5F5F5');hemi.intensity=night?.35:1.1;sun.intensity=night?.5:1.6;hemi.color.set(night?'#8aa0ff':'#ffffff')};
function openTab(t){if(innerWidth>760)return;const on=document.body.classList.contains('t-'+t);document.body.className=document.body.className.replace(/t-\w+/g,'').trim();if(!on||t==='right')document.body.classList.add('t-'+t);document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',document.body.classList.contains('t-'+b.dataset.t)))}
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{const on=document.body.classList.contains('t-'+b.dataset.t);document.body.className=document.body.className.replace(/t-\w+/g,'').trim();if(!on)document.body.classList.add('t-'+b.dataset.t);document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on',document.body.classList.contains('t-'+x.dataset.t)))});
function ring(a,t){const p=t?a/t:0;return`<svg width="28" height="28" viewBox="0 0 36 36"><circle cx="18" cy="18" r="14" fill="none" stroke="var(--ln)" stroke-width="5"/><circle cx="18" cy="18" r="14" fill="none" stroke="#14C16F" stroke-width="5" stroke-dasharray="${88*p} 88" transform="rotate(-90 18 18)" stroke-linecap="round"/></svg>`}
let banShown='';
function renderUI(){const typing=document.activeElement&&document.activeElement.tagName==='TEXTAREA'&&document.activeElement.value;const ns=names();const c={working:0,waiting_user:0,error:0,rest:0};ns.forEach(n=>{const s=stat(n);c[s]!==undefined&&s!=='rest'?c[s]++:c.rest++});$('cw').textContent=c.working;$('cq').textContent=c.waiting_user;$('ce').textContent=c.error;$('cr').textContent=c.rest;
 $('floors').innerHTML=TEAMS.map(t=>{const m=ns.filter(n=>team(n)===t),a=m.filter(n=>stat(n)==='working').length;return`<div class="fl ${t===cur?'on':''}" data-f="${t}">${ring(a,m.length)}<b>${t}</b><span style="color:var(--mut)">${a}/${m.length}</span></div>`}).join('');
 document.querySelectorAll('.fl').forEach(e=>e.onclick=()=>{goFloor(e.dataset.f);openTab('right')});
 const W=ns.filter(n=>['waiting_user','error'].includes(stat(n)));if(!typing)$('queue').innerHTML=W.length?W.map(n=>`<div class="q"><b><i class="d" style="background:${COL[stat(n)]}"></i> ${esc(full(n))}</b><div class="s">${esc(st(n).step||'')}</div>${stat(n)==='waiting_user'?msgBox(n,true):msgBox(n,false)+'<div class="acts">'+chatBtn(n)+'</div>'}</div>`).join(''):'<div style="color:var(--mut)">Nothing waiting 🎉</div>';
 $('fin').innerHTML=ns.filter(n=>stat(n)==='done').map(n=>`<div>✓ <b>${esc(n)}</b> ${esc(st(n).step||'')} · ${ago(st(n).t)}</div>`).join('')||'<div>None yet</div>';
 $('rts').innerHTML=Object.entries(S.routines).flatMap(([b,it])=>it.map(i=>`<div>⏱ <b>${esc(b)}</b> ${esc(i.name)} · ${esc(i.schedule||'')}${i.next_run?' → '+esc(i.next_run):''}</div>`)).join('')||'<div>No routines posted</div>';
 $('rt').textContent=cur+' floor';const fb=ns.filter(n=>team(n)===cur);
 $('bots').innerHTML=fb.map(n=>`<div class="bt ${n===sel?'on':''}" data-b="${esc(n)}"><i class="d" style="background:${COL[stat(n)]||'#c8c8c8'}"></i><div><b>${esc(full(n))}</b><small>${esc(st(n).step||stat(n).replace('_',' '))}</small></div></div>`).join('')||'<div style="color:var(--mut)">Empty floor</div>';
 document.querySelectorAll('.bt').forEach(e=>e.onclick=()=>{sel=e.dataset.b;renderUI()});
 const d=$('det');if(typing){}else if(sel&&ns.includes(sel)){const s=st(sel),u=S.usage&&find(S.usage.bots,sel),r=find(S.routines,sel)||[];d.hidden=false;d.innerHTML=`<h4>${esc(full(sel))}</h4><div><i class="d" style="background:${COL[stat(sel)]}"></i> ${esc(stat(sel).replace('_',' '))} · ${esc(team(sel))}</div><p style="margin:8px 0">${esc(s.step||'No step posted')}</p><div style="color:var(--mut);font-size:12px">${ago(s.t)}${u!=null?' · '+esc(u)+'% of usage':''}</div>${r.map(i=>`<div style="font-size:12px;color:var(--mut)">⏱ ${esc(i.name)} ${esc(i.next_run||'')}</div>`).join('')}${msgBox(sel,stat(sel)==='waiting_user')}<div style="margin-top:8px">${chatBtn(sel)||'<span style="color:var(--mut)">No chat link</span>'}</div>`}else d.hidden=true;
 const wq=ns.filter(n=>stat(n)==='waiting_user');const ban=$('ban');if(wq.length){const n=wq[0];ban.innerHTML=`<span>⏳ <b>${esc(full(n))}</b> is waiting on you${wq.length>1?` (+${wq.length-1})`:''}: ${esc(st(n).step||'')}</span>${chatBtn(n)}`;ban.classList.add('show')}else ban.classList.remove('show');
 const u=S.usage;if(u){const p=Math.min(100,+u.total_used_pct||0);$('ga').setAttribute('stroke-dasharray',`${2.64*p} 264`);$('ga').setAttribute('stroke',p>85?'#E5484D':p>60?'#F59312':'#1E86FC');$('gt').textContent=Math.round(p)+'%';$('gr').textContent=u.resets_at?'Resets '+u.resets_at:''}
 $('logl').innerHTML=S.log.slice(-60).reverse().map(l=>`<div>${pt(l.t)} ${esc(l.m)}</div>`).join('')}
function ingest(m){if(m.event!=='message')return false;let d;try{d=JSON.parse(m.message)}catch{S.log.push({t:m.time,m:m.message});return true}const t=m.time;
 const sum=d.bot?`${d.bot}: ${d.status||''} ${d.step||''}`:d.roster?`roster (${d.roster.length})`:d.type==='usage'?`usage ${d.total_used_pct}%`:Object.keys(d).join(',')+' updated';S.log.push({t,m:sum});
 if(d.roster)S.roster=d.roster;if(d.groups)Object.assign(S.groups,d.groups);if(d.chat)Object.assign(S.chat,d.chat);if(d.looks)Object.assign(S.looks,d.looks);
 if(d.routines&&d.routines.bot)S.routines[key(d.routines.bot)]=d.routines.items||[];if(d.type==='usage')S.usage=d;
 if(d.bot&&d.status){d.id=m.id;const k=names().find(x=>x.toLowerCase()===key(d.bot).toLowerCase())||key(d.bot);const o=S.status[k];if(!o||o.t<=t)S.status[k]={...d,t}}return true}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-send],[data-ap]');if(!b)return;const n=b.dataset.send||b.dataset.ap;const ref=st(n).id||'';
 if(b.dataset.ap){b.disabled=true;await sendTo(n,'approve','Approved',ref);b.disabled=false;return}
 const ta=b.parentElement.querySelector('textarea');const v=ta.value.trim();if(!v)return toast('Type a message first',false);b.disabled=true;if(await sendTo(n,'message',v,ref))ta.value='';b.disabled=false});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&e.target.tagName==='TEXTAREA'){e.preventDefault();e.target.parentElement.querySelector('button').click()}});
const SET=$('set');$('gear').onclick=()=>{const c=cfg();$('s_mode').value=c.mode||'ntfy';$('s_url').value=c.url||'';$('s_key').value=c.key||'';SET.hidden=false};
$('s_close').onclick=()=>SET.hidden=true;$('s_clear').onclick=()=>{localStorage.removeItem('hqcfg');SET.hidden=true;toast('Settings cleared',true)};
$('s_save').onclick=()=>{localStorage.setItem('hqcfg',JSON.stringify({mode:$('s_mode').value,url:$('s_url').value.trim(),key:$('s_key').value.trim().replace(/^Bearer\s+/i,'')}));SET.hidden=true;toast('Saved in this browser',true)};
function refresh(){layoutBots();renderUI()}
setInterval(()=>{$('clock').textContent=new Date().toLocaleTimeString('en-US',{timeZone:'America/Los_Angeles',hour:'numeric',minute:'2-digit',second:'2-digit'})+' PT'},1000);
setInterval(renderUI,30000);addEventListener('hashchange',()=>location.reload());
loop();
(async()=>{if(!T){$('hint').hidden=false;return}const base='https://ntfy.sh/'+encodeURIComponent(T);
 try{const r=await fetch(base+'/json?poll=1&since=12h');(await r.text()).split('\n').filter(Boolean).forEach(l=>{try{ingest(JSON.parse(l))}catch{}})}catch(e){console.warn('poll failed')}
 refresh();const es=new EventSource(base+'/sse');es.onopen=()=>$('live').style.background='#14C16F';es.onerror=()=>$('live').style.background='#959595';es.onmessage=e=>{if(ingest(JSON.parse(e.data)))refresh()}})();
</script></body></html>
